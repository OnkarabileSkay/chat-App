name: Java Unit Tests

on:
  push:
    branches: [ master, Part2POE, Part3 ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Download JUnit
      run: |
        wget -q https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
        wget -q https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar
    
    - name: Compile main and test code
      run: |
        mkdir -p build
        javac -cp ".:junit-4.13.2.jar:hamcrest-core-1.3.jar" -d build src/login/*.java test/login/*.java
    
    - name: Run unit tests
      run: |
        java -cp ".:junit-4.13.2.jar:hamcrest-core-1.3.jar:build" org.junit.runner.JUnitCore login.PoePart3Test
