name: Java Unit Tests

on:
  push:
    branches: [ master, Part2POE, Part3 ]
  pull_request:
    branches: [ master, Part2POE, Part3 ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Compile project
      run: javac -cp "lib/*" -d build src/login/*.java
    
    - name: Run unit tests
      run: java -cp "build:lib/*" org.junit.runner.JUnitCore login.PoePart3Test
